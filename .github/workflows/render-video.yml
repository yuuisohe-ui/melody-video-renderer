name: render-video
on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: npm install googleapis

      - name: Download audio and cover
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_KEYWORDS: ${{ github.event.client_payload.video_keywords }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -o work/audio.mp3 "$AUDIO_URL"
          cat > /tmp/get_cover.py << 'EOF'
import urllib.parse, urllib.request, json, os
keywords = os.environ.get('VIDEO_KEYWORDS') or os.environ.get('SONG_TITLE', 'music')
key = os.environ.get('PIXABAY_KEY', '')
q = urllib.parse.quote(keywords)
url = "https://pixabay.com/api/?key=" + key + "&q=" + q + "&image_type=photo&per_page=3"
try:
    with urllib.request.urlopen(url) as r:
        data = json.loads(r.read())
    hits = data.get('hits', [])
    cover = hits[0]['largeImageURL'] if hits else ''
except Exception:
    cover = ''
print(cover)
EOF
          COVER_URL=$(python3 /tmp/get_cover.py)
          if [ -z "$COVER_URL" ]; then
            COVER_URL="https://placehold.co/1280x720/1a1a2e/ffffff?text=Music"
          fi
          curl -fsSL --retry 3 -o work/cover.jpg "$COVER_URL"
          ffmpeg -y -i work/cover.jpg -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" work/cover_resized.jpg

      - name: Generate subtitles
        env:
          ALIGNED_WORDS: ${{ toJson(github.event.client_payload.aligned_words) }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
        run: |
          cat << 'SCRIPT' > work/build_ass.js
          const words = JSON.parse(process.env.ALIGNED_WORDS);
          const title = process.env.SONG_TITLE;
          const header = "[Script Info]\nScriptType: v4.00+\nPlayResX: 1280\nPlayResY: 720\nWrapStyle: 2\n\n[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\nStyle: Default,Noto Sans CJK SC,48,&H00FFFFFF,&H0000FFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,2,60,60,80,1\nStyle: Title,Noto Sans CJK SC,36,&H00C9A96E,&H0000FFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,2,1,8,40,40,30,1\n\n[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n";
          function fmt(s) {
            const h = Math.floor(s/3600);
            const m = Math.floor(s/60)%60;
            const sec = (s%60).toFixed(2).padStart(5,'0');
            return h+':'+String(m).padStart(2,'0')+':'+sec;
          }
          let lines = ["Dialogue: 0,0:00:00.00,0:00:05.00,Title,,0,0,0,fad(400,400)," + title];
          let cur = [], i = 0;
          while(i < words.length) {
            cur.push(words[i]);
            const next = words[i+1];
            if(!next || next.startS - words[i].endS > 1.2 || cur.length >= 10) {
              const start = cur[0].startS;
              const end = cur[cur.length-1].endS;
              const text = cur.map(w => {
                const cs = Math.max(1, Math.round((w.endS - w.startS)*100));
                return "{\\kf" + cs + "}" + w.word + " ";
              }).join('');
              lines.push("Dialogue: 0," + fmt(start) + "," + fmt(end) + ",Default,,0,0,0,," + text.trim());
              cur = [];
            }
            i++;
          }
          require('fs').writeFileSync('work/subs.ass', header + lines.join('\n'));
          console.log('ASS generated');
          SCRIPT
          node work/build_ass.js

      - name: Render video with ffmpeg
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/audio.mp3)
          ffmpeg -y \
            -loop 1 -framerate 30 -t "$DUR" -i work/cover_resized.jpg \
            -i work/audio.mp3 \
            -filter_complex "[0:v]scale=1600:900,zoompan=z='min(zoom+0.0008,1.15)':d=900:s=1280x720:fps=30,subtitles='work/subs.ass':fontsdir=/usr/share/fonts[bg];color=c=0xffffff@0.8:s=1280x4:d=${DUR}[barbg];[bg][barbg]overlay=0:H-20:shortest=1[withbar];color=c=0xffd700:s=1280x4:d=${DUR}[barfg];[withbar][barfg]overlay='x=-W+(W*t/${DUR})':y=H-20:shortest=1[v]" \
            -map "[v]" -map 1:a \
            -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -shortest \
            work/out.mp4

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
        run: |
          cat << 'SCRIPT' > work/upload.js
          const { google } = require('googleapis');
          const fs = require('fs');
          const oauth2 = new google.auth.OAuth2(
            process.env.YT_CLIENT_ID,
            process.env.YT_CLIENT_SECRET
          );
          oauth2.setCredentials({ refresh_token: process.env.YT_REFRESH_TOKEN });
          const yt = google.youtube({ version: 'v3', auth: oauth2 });
          async function main() {
            const res = await yt.videos.insert({
              part: ['snippet','status'],
              requestBody: {
                snippet: {
                  title: process.env.SONG_TITLE + ' (Lyric Video)',
                  description: process.env.SONG_TITLE + '\n\nAI generated lyric video\n\n#lyricvideo #music #aimusic',
                  tags: ['lyric video','music','AI music'],
                  categoryId: '10',
                },
                status: {
                  privacyStatus: 'unlisted',
                  selfDeclaredMadeForKids: false,
                },
              },
              media: { body: fs.createReadStream('work/out.mp4') },
            });
            const videoId = res.data.id;
            const url = 'https://youtu.be/' + videoId;
            console.log('VIDEO_ID=' + videoId);
            console.log('VIDEO_URL=' + url);
            fs.writeFileSync('work/result.json', JSON.stringify({ videoId, url }));
          }
          main().catch(e => { console.error(e); process.exit(1); });
          SCRIPT
          node work/upload.js

      - name: Send callback to Supabase
        if: success()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          RESULT=$(cat work/result.json)
          VIDEO_ID=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.videoId)")
          VIDEO_URL=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.url)")
          TS=$(date +%s)
          BODY="{\"job_id\":\"${JOB_ID}\",\"status\":\"done\",\"youtube_video_id\":\"${VIDEO_ID}\",\"youtube_url\":\"${VIDEO_URL}\"}"
          SIG=$(echo -n "${TS}.${BODY}" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $2}')
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-timestamp: ${TS}" \
            -H "x-signature: ${SIG}" \
            -d "${BODY}"

      - name: Send failure callback
        if: failure()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          TS=$(date +%s)
          BODY="{\"job_id\":\"${JOB_ID}\",\"status\":\"failed\",\"error\":\"render failed\"}"
          SIG=$(echo -n "${TS}.${BODY}" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $2}')
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-timestamp: ${TS}" \
            -H "x-signature: ${SIG}" \
            -d "${BODY}"
