name: render-video
on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install pillow numpy --break-system-packages
          npm install googleapis

      - name: Extract lyrics text
        env:
          ALIGNED_WORDS: ${{ toJson(github.event.client_payload.aligned_words) }}
        run: |
          LYRICS=$(node -e "
            const w = JSON.parse(process.env.ALIGNED_WORDS);
            console.log(w.map(x=>x.word||'').join(' ').replace(/\n/g,' ').trim().slice(0,400));
          ")
          echo "LYRICS_TEXT=$LYRICS" >> $GITHUB_ENV

      - name: Download audio and cover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_KEYWORDS: ${{ github.event.client_payload.video_keywords }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          LYRICS_TEXT: ${{ env.LYRICS_TEXT }}
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -o work/audio.mp3 "$AUDIO_URL"
          python3 scripts/get_cover.py
          if [ ! -s work/cover_raw.jpg ]; then
            echo "[get_cover] Falling back to placeholder" >&2
            curl -fsSL --retry 3 -o work/cover_raw.jpg \
              "https://placehold.co/420x420/1a1a2e/ffffff?text=Music"
          fi
          ffmpeg -y -i work/cover_raw.jpg -vf "crop=min(iw\,ih):min(iw\,ih),scale=420:420" -update 1 -frames:v 1 work/cover.jpg
          echo "Cover size: $(wc -c < work/cover.jpg) bytes"

      - name: Generate vinyl background
        run: |
          cp assets/vinyl_bg_static.png work/vinyl_bg.png

      - name: Generate subtitles
        env:
          ALIGNED_WORDS: ${{ toJson(github.event.client_payload.aligned_words) }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
        run: node scripts/build_ass.js

      - name: Generate waveform and cover glow
        run: |
          ffmpeg -y -i work/audio.mp3 work/audio.wav 2>/dev/null
          python3 scripts/generate_waveform.py
          python3 scripts/generate_cover_glow.py

      - name: Render video with ffmpeg
        env:
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/audio.mp3)
          SAFE_TITLE=$(echo "${SONG_TITLE}" | sed "s/'/\\\\'/g; s/:/\\\\:/g; s/,/\\\\,/g")
          ffmpeg -y \
            -loop 1 -framerate 30 -t "$DUR" -i work/cover.jpg \
            -loop 1 -framerate 30 -t "$DUR" -i work/vinyl_bg.png \
            -i work/audio.mp3 \
            -loop 1 -framerate 30 -t "$DUR" -i work/waveform.png \
            -loop 1 -framerate 30 -t "$DUR" -i work/cover_glow.png \
            -filter_complex "\
              [0:v]scale=328:328,format=rgba[cover_resized];\
              [1:v]scale=1280:720,format=rgba[bg];\
              [cover_resized]pad=1280:720:181:128:color=black@0[cover_padded];\
              [cover_padded][bg]overlay=0:0:format=auto[video_base];\
              [4:v]format=rgba,geq=r='r(X,Y)':g='g(X,Y)':b='b(X,Y)':a='alpha(X,Y)*(0.4+0.6*sin(2*PI*t/3.5))'[glow_anim];\
              [video_base][glow_anim]overlay=x=181:y=128:format=auto[v_glow];\
              [v_glow]drawbox=x=112:y=534:w=4:h=70:color=0x89c4d4@0.85:t=fill,\
              drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Medium.ttc:text='${SAFE_TITLE}':fontcolor=white:fontsize=52:x=120:y=538:shadowx=3:shadowy=3:shadowcolor=black@0.55,\
              drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:text='멜로디 클래스 · 노래 기반 언어 교육 플랫폼':fontcolor=0x89c4d4:fontsize=24:x=120:y=604:shadowx=1:shadowy=1:shadowcolor=black@0.4,\
              subtitles='work/subs.ass':fontsdir=/usr/share/fonts[v_text];\
              [v_text][3:v]overlay=x=0:y=660[v]" \
            -map "[v]" -map 2:a \
            -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -shortest \
            work/out.mp4

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
          ALIGNED_WORDS: ${{ toJson(github.event.client_payload.aligned_words) }}
        run: node scripts/upload_youtube.js

      - name: Send callback to Supabase
        if: success()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          VIDEO_ID=$(node -e "console.log(require('./work/result.json').videoId)")
          VIDEO_URL=$(node -e "console.log(require('./work/result.json').url)")
          BODY="{\"job_id\":\"${JOB_ID}\",\"status\":\"done\",\"youtube_video_id\":\"${VIDEO_ID}\",\"youtube_url\":\"${VIDEO_URL}\"}"
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${CALLBACK_SECRET}" \
            -d "${BODY}"

      - name: Send failure callback
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          BODY="{\"job_id\":\"${JOB_ID}\",\"status\":\"failed\",\"error\":\"render failed\"}"
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${CALLBACK_SECRET}" \
            -d "${BODY}"
