name: render-video
on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install pillow numpy --break-system-packages
          npm install googleapis

      - name: Download audio and cover
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_KEYWORDS: ${{ github.event.client_payload.video_keywords }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -o work/audio.mp3 "$AUDIO_URL"
          COVER_URL=$(python3 scripts/get_cover.py)
          if [ -z "$COVER_URL" ]; then
            COVER_URL="https://placehold.co/400x400/1a1a2e/ffffff?text=Music"
          fi
          echo "$COVER_URL" > /tmp/cover_url.txt
          curl -fsSL --retry 3 -o work/cover.jpg "$COVER_URL"

      - name: Generate vinyl background
        run: |
          cp assets/vinyl_bg_static.png work/vinyl_bg.png

      - name: Generate subtitles
        env:
          ALIGNED_WORDS: ${{ toJson(github.event.client_payload.aligned_words) }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
        run: node scripts/build_ass.js

      - name: Render video with ffmpeg
        env:
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/audio.mp3)
          ffmpeg -y \
            -loop 1 -framerate 30 -t "$DUR" -i work/vinyl_bg.png \
            -loop 1 -t "$DUR" -i work/cover.jpg \
            -i work/audio.mp3 \
            -filter_complex "\
                [1:v]scale=420:420[cover];\
                [0:v]scale=1280:720[bg];\
                [bg][cover]overlay=x=120:y=100[withcover];\
                [withcover]drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc:text='${SONG_TITLE}':fontcolor=white:fontsize=28:x=120:y=560,\
                drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:text='멜로디 클래스 · 노래 기반 언어 교육 플랫폼':fontcolor=0x888888:fontsize=16:x=120:y=595,\
                subtitles='work/subs.ass':fontsdir=/usr/share/fonts[v]" \
            -map "[v]" -map 2:a \
            -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -shortest \
            work/out.mp4

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SONG_TITLE: ${{ github.event.client_payload.song_title }}
          ALIGNED_WORDS: ${{ toJson(github.event.client_payload.aligned_words) }}
        run: node scripts/upload_youtube.js

      - name: Send callback to Supabase
        if: success()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          VIDEO_ID=$(node -e "console.log(require('./work/result.json').videoId)")
          VIDEO_URL=$(node -e "console.log(require('./work/result.json').url)")
          TS=$(date +%s)
          BODY="{\"job_id\":\"${JOB_ID}\",\"status\":\"done\",\"youtube_video_id\":\"${VIDEO_ID}\",\"youtube_url\":\"${VIDEO_URL}\"}"
          SIG=$(echo -n "${TS}.${BODY}" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $2}')
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-timestamp: ${TS}" \
            -H "x-signature: ${SIG}" \
            -d "${BODY}"

      - name: Send failure callback
        if: failure()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          TS=$(date +%s)
          BODY="{\"job_id\":\"${JOB_ID}\",\"status\":\"failed\",\"error\":\"render failed\"}"
          SIG=$(echo -n "${TS}.${BODY}" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $2}')
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-timestamp: ${TS}" \
            -H "x-signature: ${SIG}" \
            -d "${BODY}"
